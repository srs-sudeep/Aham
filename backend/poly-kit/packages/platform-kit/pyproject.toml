[project]
name = "platform-kit"
version = "0.1.0"
description = "Shared baseline for all FastAPI services: RBAC, errors, logging, middleware, DB, health, telemetry, messaging + the `dx` CLI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "structlog>=24.4",
  "httpx>=0.28",
  "tenacity>=9.0",
  "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
]
kafka = ["faststream[kafka]>=0.5.30"]
redis = ["redis[hiredis]>=5.0"]
saas = [
  "redis[hiredis]>=5.0",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "email-validator>=2.0",
  "pyotp>=2.9",
]
stripe = ["stripe>=11.0"]
testing = ["pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "fakeredis>=2.26"]

[project.scripts]
dx = "platform_kit.cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_kit"]
