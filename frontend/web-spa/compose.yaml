# Production-like SPA container on http://localhost:8080 (`docker compose up --build`).
# Day-to-day UI work uses `pnpm dev` (Vite on :5173); the backend repo runs its own compose stack.
name: web-spa-web

services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001/api/v1}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-saas}
        VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-en}
    image: ${REGISTRY:-local}/web-spa-web:${TAG:-dev}
    ports: ["8080:8080"]
    restart: unless-stopped
