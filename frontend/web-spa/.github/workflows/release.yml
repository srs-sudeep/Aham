name: Release

# Push a semver tag (git tag v1.2.3 && git push --tags) to publish ghcr.io/<owner>/<repo>:1.2.3.
# VITE_* values are baked in at build time: set the repository variables VITE_API_BASE_URL
# (and optionally VITE_AUTH_MODE / VITE_DEFAULT_LOCALE) to the production values.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8001/api/v1' }}
            VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE || 'saas' }}
            VITE_DEFAULT_LOCALE=${{ vars.VITE_DEFAULT_LOCALE || 'en' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
