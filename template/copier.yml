# ─────────────────────────────────────────────────────────────
#  Aham Platform Template  ·  copier.yml
#  New project:   uvx copier copy --trust ./template my-project
#  Pull updates:  uvx copier update --trust
# ─────────────────────────────────────────────────────────────
_min_copier_version: "9.4.0"
_subdirectory: "{{ 'frontend' if stack == 'frontend' else 'backend' }}"
_answers_file: .copier-answers.yml

stack:
  type: str
  help: Backend (FastAPI) or frontend (Vite + ui-kit)?
  choices:
    "Backend (FastAPI + platform-kit)": backend
    "Frontend (Vite + React + ui-kit)": frontend
  default: backend

project_name:
  type: str
  help: Human-readable project name
  default: My Platform

project_slug:
  type: str
  help: Machine name (lowercase, dashes)
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9-]+$')) %}
    Use lowercase letters, digits and dashes only.
    {% endif %}

# ── backend-only ─────────────────────────────────────────────
repo_layout:
  type: str
  help: What kind of repository is this?
  when: "{{ stack == 'backend' }}"
  choices:
    "Monorepo (one repo: shared kit + one or many services)": monorepo
    "Polyrepo SERVICE repo (one service; kit pulled from its own repo)": polyrepo_service
    "Polyrepo KIT repo (the shared platform-kit that service repos depend on)": polyrepo_kit
  default: monorepo

architecture:
  type: str
  help: Single service (modular monolith) or microservices?
  when: "{{ stack == 'backend' and repo_layout == 'monorepo' }}"
  choices:
    "Modular monolith (one service)": monolith
    "Microservices (many services)": microservices
  default: monolith

first_service:
  type: str
  help: Name of the first service (lowercase, dashes)
  default: core-api
  when: "{{ stack == 'backend' and repo_layout != 'polyrepo_kit' }}"
  validator: >-
    {% if not (first_service | regex_search('^[a-z][a-z0-9-]+$')) %}
    Use lowercase letters, digits and dashes only.
    {% endif %}

messaging:
  type: str
  help: Message broker for async events
  when: "{{ stack == 'backend' and repo_layout != 'polyrepo_kit' }}"
  choices:
    "None (HTTP only)": none
    "Kafka (FastStream + transactional outbox)": kafka
  default: none

platform_profile:
  type: str
  help: >-
    API-only (JWT verify + RBAC code) or SaaS spine (local IdP, Redis, tenancy,
    entitlements, audit). Enterprise SSO/SCIM/Stripe are extension ports in saas.
  when: "{{ stack == 'backend' and repo_layout != 'polyrepo_kit' }}"
  choices:
    "SaaS spine (IdP, Redis, tenancy, entitlements)": saas
    "API only (verify JWT from external IdP)": api
  default: saas

repo_manager:
  type: str
  help: Task runner / repo manager (the built-in `dx` CLI always works too)
  when: "{{ stack == 'backend' and repo_layout == 'monorepo' }}"
  choices:
    "None, use the built-in dx CLI": none
    "Nx": nx
    "moon": moon
  default: none

kit_git_url:
  type: str
  help: >-
    Git URL of your platform-kit repo. Use https://... (CI token) or ssh://git@host/org/repo.git
    (deploy key; also used by the Docker build). uv does not accept the scp form git@host:org/repo.
  when: "{{ stack == 'backend' and repo_layout == 'polyrepo_service' }}"
  default: "https://github.com/your-org/platform-kit.git"

kit_version:
  type: str
  help: platform-kit git tag to pin
  when: "{{ stack == 'backend' and repo_layout == 'polyrepo_service' }}"
  default: "v0.1.0"

python_version:
  type: str
  default: "3.12"
  choices: ["3.12", "3.13"]
  when: "{{ stack == 'backend' }}"

# ── frontend-only ────────────────────────────────────────────
api_base_url:
  type: str
  help: Default API base URL for the SPA, including the API prefix (Vite env)
  when: "{{ stack == 'frontend' }}"
  default: "http://localhost:8001/api/v1"

auth_mode:
  type: str
  help: How the SPA signs in
  when: "{{ stack == 'frontend' }}"
  choices:
    "SaaS backend (platform-kit identity: password/SSO, refresh cookie, tenant switch)": saas
    "Dev mock principal (UI-only, pair with MSW mocks)": dev
  default: saas

default_locale:
  type: str
  help: Default UI locale
  when: "{{ stack == 'frontend' }}"
  choices:
    English: en
    Japanese: ja
  default: en

# ── shared ───────────────────────────────────────────────────
ai_tools:
  type: str
  help: AI coding tools to generate config for
  multiselect: true
  choices:
    Claude Code: claude
    Cursor: cursor
  default: [claude, cursor]

# ── derived (not asked) ──────────────────────────────────────
is_microservices:
  type: bool
  when: false
  default: "{{ stack == 'backend' and (repo_layout == 'polyrepo_service' or architecture == 'microservices') }}"

has_kit_source:
  type: bool
  when: false
  default: "{{ stack == 'backend' and repo_layout != 'polyrepo_service' }}"

is_saas:
  type: bool
  when: false
  default: "{{ stack == 'backend' and platform_profile == 'saas' }}"

_tasks:
  # ── backend ────────────────────────────────────────────────
  - command: "uv sync --all-packages --no-install-project"
    when: "{{ stack == 'backend' and _copier_operation == 'copy' }}"
  - command: "uv run dx new-service {{ first_service }} --with-example"
    when: "{{ stack == 'backend' and _copier_operation == 'copy' and repo_layout != 'polyrepo_kit' }}"
  - command: "uv run dx new-saas {{ first_service }}"
    when: "{{ stack == 'backend' and _copier_operation == 'copy' and repo_layout != 'polyrepo_kit' and platform_profile == 'saas' and architecture != 'microservices' }}"
  - command: "uv run dx new-service identity --with-saas && uv run dx new-service billing --with-saas"
    when: "{{ stack == 'backend' and _copier_operation == 'copy' and repo_layout == 'monorepo' and architecture == 'microservices' and platform_profile == 'saas' }}"
  - command: "uv sync --all-packages"
    when: "{{ stack == 'backend' }}"
  - command: "uv run ruff format --quiet . && uv run ruff check --fix --quiet . || true"
    when: "{{ stack == 'backend' and _copier_operation == 'copy' }}"
  - command: "git init -q -b main && git add -A && uv run pre-commit install"
    when: "{{ stack == 'backend' and _copier_operation == 'copy' }}"

  # ── frontend ───────────────────────────────────────────────
  - command: "pnpm install || npm install -g pnpm && pnpm install"
    when: "{{ stack == 'frontend' and _copier_operation == 'copy' }}"
  - command: "pnpm dx check || true"
    when: "{{ stack == 'frontend' and _copier_operation == 'copy' }}"
  - command: "git init -q -b main && git add -A"
    when: "{{ stack == 'frontend' and _copier_operation == 'copy' }}"
