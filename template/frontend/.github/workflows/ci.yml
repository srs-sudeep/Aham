name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Full-repo dx check
        run: pnpm dx check --format github
      - run: pnpm test
      - run: pnpm build
      - name: Bundle budget
        run: |
          SIZE=$(wc -c < apps/web/dist/assets/*.js | awk '{s+=$1} END {print s}')
          echo "JS bytes: $SIZE"
          test "$SIZE" -lt 900000
